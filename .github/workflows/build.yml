name: Pulse Companion · 共享业务与旧版构建

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: 变更范围与文档检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 核对提交内容与脚本引用
        run: node .github/scripts/preflight.mjs check HEAD
      - name: 提交门禁回归测试
        run: node --test .github/scripts/preflight.checks.mjs
      - run: node --test .github/scripts/change-scope.test.mjs
      - id: scope
        run: node .github/scripts/change-scope.mjs
  build-and-test:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build shared business and legacy WinForms
        shell: powershell
        run: .\build.ps1

      - name: Offline parser tests
        shell: powershell
        run: .\verify.ps1 -Development -Offline

      - name: Upload unsigned binaries
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: pulse-companion-legacy-windows-x64-unsigned
          path: bin/*.exe
          if-no-files-found: error
