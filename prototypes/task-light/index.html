<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Codex 任务信号灯 · 三版原型</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #fcfcfb;
      --paper-strong: #ffffff;
      --ink: #262623;
      --muted: #777772;
      --hairline: #e4e4e0;
      --green: #48a868;
      --green-soft: #e8f5eb;
      --amber: #e49a31;
      --amber-soft: #fff2de;
      --red: #c55d57;
      --red-soft: #fae9e7;
      --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      color: var(--ink);
      background: #18302f;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    #stage {
      width: 100%;
      height: 100%;
    }

    .desktop {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 18% 18%, rgba(128, 189, 174, 0.42), transparent 34%),
        radial-gradient(circle at 83% 76%, rgba(83, 109, 151, 0.56), transparent 38%),
        linear-gradient(135deg, #1f4945 0%, #203342 52%, #16222d 100%);
    }

    .desktop::before,
    .desktop::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
      opacity: 0.34;
      pointer-events: none;
    }

    .desktop::before {
      width: 560px;
      height: 560px;
      left: -180px;
      bottom: -320px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      box-shadow:
        0 0 0 74px rgba(255, 255, 255, 0.025),
        0 0 0 148px rgba(255, 255, 255, 0.018);
    }

    .desktop::after {
      width: 420px;
      height: 420px;
      right: -180px;
      top: -220px;
      background: rgba(160, 196, 202, 0.08);
    }

    .context-label {
      position: absolute;
      top: 18px;
      left: 26px;
      z-index: 4;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 11px 7px 8px;
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.78);
      background: rgba(18, 29, 35, 0.42);
      backdrop-filter: blur(12px);
      font-size: 12px;
      letter-spacing: 0.01em;
    }

    .context-label-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 0 3px rgba(228, 154, 49, 0.14);
    }

    .workspace-window {
      position: absolute;
      inset: 54px 46px 68px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 16px;
      background: rgba(246, 247, 246, 0.96);
      box-shadow:
        0 34px 80px rgba(5, 13, 20, 0.28),
        0 2px 8px rgba(5, 13, 20, 0.18);
    }

    .window-titlebar {
      display: grid;
      grid-template-columns: 170px 1fr 170px;
      align-items: center;
      height: 48px;
      padding: 0 18px;
      border-bottom: 1px solid #e7e8e6;
      background: rgba(255, 255, 255, 0.94);
    }

    .window-dots {
      display: flex;
      gap: 7px;
    }

    .window-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #d8dad7;
    }

    .window-title {
      color: #4d4f4b;
      font-size: 13px;
      text-align: center;
    }

    .window-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .window-action {
      width: 25px;
      height: 25px;
      border: 1px solid #e3e4e1;
      border-radius: 7px;
      background: #fafbf9;
    }

    .workspace-body {
      display: grid;
      grid-template-columns: 228px 1fr;
      height: calc(100% - 48px);
    }

    .workspace-sidebar {
      padding: 20px 14px;
      border-right: 1px solid #e5e6e3;
      background: #f1f3f0;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 8px 22px;
      font-size: 13px;
      font-weight: 600;
    }

    .sidebar-brand-mark {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: #2d5a55;
      font-size: 12px;
    }

    .sidebar-section-label {
      margin: 18px 10px 8px;
      color: #949690;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 34px;
      padding: 0 10px;
      border-radius: 8px;
      color: #686a65;
      font-size: 12px;
    }

    .sidebar-item[data-current] {
      color: #31332f;
      background: #e5e9e4;
      font-weight: 600;
    }

    .sidebar-icon {
      width: 13px;
      height: 13px;
      border: 1.5px solid currentColor;
      border-radius: 4px;
      opacity: 0.66;
    }

    .workspace-main {
      position: relative;
      padding: 44px 54px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.76), rgba(255, 255, 255, 0.76)),
        repeating-linear-gradient(0deg, transparent, transparent 31px, rgba(80, 85, 80, 0.035) 32px);
    }

    .doc-kicker {
      margin: 0 0 11px;
      color: #79908a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .doc-title {
      max-width: 680px;
      margin: 0;
      color: #2f3633;
      font-size: 32px;
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .doc-subtitle {
      max-width: 740px;
      margin: 14px 0 30px;
      color: #7a7f7b;
      font-size: 14px;
      line-height: 1.7;
    }

    .doc-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 18px;
      max-width: 820px;
    }

    .doc-card {
      min-height: 164px;
      padding: 20px;
      border: 1px solid #e5e7e3;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.72);
    }

    .doc-card-title {
      margin-bottom: 17px;
      color: #4d524e;
      font-size: 12px;
      font-weight: 650;
    }

    .doc-line {
      width: 100%;
      height: 8px;
      margin: 11px 0;
      border-radius: 999px;
      background: #e8ebe7;
    }

    .doc-line:nth-child(3) { width: 88%; }
    .doc-line:nth-child(4) { width: 72%; }
    .doc-line:nth-child(5) { width: 81%; }

    .chart {
      display: flex;
      align-items: flex-end;
      gap: 9px;
      height: 96px;
      padding-top: 8px;
    }

    .chart-bar {
      flex: 1;
      min-width: 12px;
      border-radius: 4px 4px 2px 2px;
      background: #aecac2;
    }

    .chart-bar:nth-child(1) { height: 38%; }
    .chart-bar:nth-child(2) { height: 62%; }
    .chart-bar:nth-child(3) { height: 48%; }
    .chart-bar:nth-child(4) { height: 76%; background: #6fa294; }
    .chart-bar:nth-child(5) { height: 67%; }
    .chart-bar:nth-child(6) { height: 88%; background: #477d71; }

    .desktop-taskbar {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(238, 243, 243, 0.82);
      backdrop-filter: blur(20px) saturate(1.2);
    }

    .taskbar-apps {
      display: flex;
      gap: 9px;
    }

    .taskbar-app {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 8px;
      color: #5e6865;
      background: rgba(255, 255, 255, 0.66);
      box-shadow: 0 1px 2px rgba(38, 53, 54, 0.08);
      font-size: 10px;
      font-weight: 700;
    }

    .taskbar-app[data-active] {
      background: #fff;
      box-shadow: 0 2px 8px rgba(38, 53, 54, 0.12);
    }

    .task-light-shell {
      position: fixed;
      top: 92px;
      right: 84px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
    }

    .task-light-handle {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 0;
      cursor: grab;
      touch-action: none;
      transition:
        transform 140ms var(--ease-out),
        box-shadow 160ms ease-out;
    }

    .task-light-handle:active {
      cursor: grabbing;
      transform: scale(0.97);
    }

    .task-light-handle:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.9);
      outline-offset: 3px;
    }

    .task-light-panel {
      position: relative;
      z-index: 1;
      margin-top: 10px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-5px) scale(0.98);
      transform-origin: top right;
      transition:
        opacity 150ms ease-out,
        transform 170ms var(--ease-out);
    }

    .task-light-shell[data-open="true"] .task-light-panel {
      pointer-events: auto;
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .panel-close {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 0;
      border-radius: 8px;
      color: #8b8d88;
      background: transparent;
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
      transition:
        color 140ms ease-out,
        background-color 140ms ease-out,
        transform 120ms ease-out;
    }

    .panel-close:active {
      transform: scale(0.94);
    }

    .task-row {
      cursor: pointer;
      transition:
        background-color 140ms ease-out,
        transform 120ms ease-out;
    }

    .task-row:active {
      transform: scale(0.99);
    }

    .toggle-switch {
      position: relative;
      width: 30px;
      height: 18px;
      padding: 0;
      border: 0;
      border-radius: 999px;
      background: #d5d7d2;
      cursor: pointer;
      transition: background-color 150ms ease-out;
    }

    .toggle-switch::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(31, 35, 32, 0.24);
      transition: transform 160ms var(--ease-out);
    }

    .toggle-switch[data-on="true"] {
      background: #5a9d70;
    }

    .toggle-switch[data-on="true"]::after {
      transform: translateX(12px);
    }

    @media (hover: hover) and (pointer: fine) {
      .task-light-handle:hover {
        transform: translateY(-1px);
      }

      .panel-close:hover {
        color: #464843;
        background: rgba(92, 96, 89, 0.08);
      }
    }

    /* Quiet Signal — a single dominant state and the least visual noise. */
    .quiet-shell .task-light-handle {
      gap: 9px;
      min-width: 66px;
      height: 36px;
      padding: 0 13px 0 10px;
      border: 1px solid rgba(225, 226, 222, 0.94);
      border-radius: 999px;
      color: #343632;
      background: rgba(252, 252, 251, 0.93);
      box-shadow:
        0 10px 28px rgba(15, 25, 29, 0.16),
        0 2px 6px rgba(15, 25, 29, 0.10),
        0 1px 0 rgba(255, 255, 255, 0.92) inset;
      backdrop-filter: blur(16px) saturate(1.2);
    }

    .quiet-signal {
      display: grid;
      width: 17px;
      height: 17px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: var(--red);
      box-shadow:
        0 0 0 4px rgba(197, 93, 87, 0.11),
        0 1px 3px rgba(120, 45, 40, 0.22);
      font-size: 11px;
      font-weight: 700;
    }

    .quiet-count {
      font-size: 13px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
    }

    .quiet-panel {
      width: 330px;
      overflow: hidden;
      border: 1px solid rgba(224, 225, 221, 0.96);
      border-radius: 15px;
      background: rgba(252, 252, 251, 0.96);
      box-shadow:
        0 24px 70px rgba(8, 17, 21, 0.24),
        0 4px 12px rgba(8, 17, 21, 0.10);
      backdrop-filter: blur(22px) saturate(1.18);
    }

    .quiet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 13px 13px 12px 16px;
      border-bottom: 1px solid #ecece8;
    }

    .quiet-title {
      margin: 0 0 3px;
      font-size: 13px;
      font-weight: 650;
    }

    .quiet-summary {
      color: #858781;
      font-size: 11px;
    }

    .quiet-list {
      padding: 6px;
    }

    .quiet-row {
      display: grid;
      grid-template-columns: 24px 1fr auto;
      align-items: center;
      gap: 9px;
      min-height: 58px;
      padding: 8px 10px;
      border-radius: 10px;
    }

    @media (hover: hover) and (pointer: fine) {
      .quiet-row:hover {
        background: #f2f3ef;
      }
    }

    .quiet-row.is-selected {
      background: #eeefeb;
    }

    .row-status-icon {
      display: grid;
      width: 21px;
      height: 21px;
      place-items: center;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
    }

    .row-status-icon.alert {
      color: #a94f49;
      background: var(--red-soft);
    }

    .row-status-icon.running {
      color: #b27420;
      background: var(--amber-soft);
    }

    .task-title {
      overflow: hidden;
      margin-bottom: 3px;
      color: #363833;
      font-size: 12px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .task-meta {
      color: #92948e;
      font-size: 10px;
    }

    .task-time {
      color: #979993;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .quiet-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 44px;
      padding: 0 16px;
      border-top: 1px solid #ecece8;
      color: #757771;
      font-size: 11px;
    }

    .footer-setting {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Status Split — show mixed states in the trigger itself. */
    .split-shell .task-light-handle {
      height: 38px;
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(225, 226, 222, 0.96);
      border-radius: 11px;
      color: #383a35;
      background: rgba(252, 252, 251, 0.95);
      box-shadow:
        0 14px 32px rgba(8, 17, 21, 0.18),
        0 2px 6px rgba(8, 17, 21, 0.10),
        0 1px 0 rgba(255, 255, 255, 0.96) inset;
      backdrop-filter: blur(18px) saturate(1.18);
    }

    .split-trigger-segment {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 100%;
      padding: 0 12px;
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .split-trigger-segment + .split-trigger-segment {
      border-left: 1px solid rgba(77, 80, 74, 0.12);
    }

    .split-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .split-indicator.alert {
      background: #e87d75;
      box-shadow: 0 0 0 3px rgba(232, 125, 117, 0.12);
    }

    .split-indicator.running {
      background: #f0ad4e;
      box-shadow: 0 0 0 3px rgba(240, 173, 78, 0.12);
    }

    .split-panel {
      width: 356px;
      overflow: hidden;
      border: 1px solid rgba(224, 225, 221, 0.96);
      border-radius: 14px;
      color: #383a35;
      background: rgba(252, 252, 251, 0.97);
      box-shadow:
        0 26px 72px rgba(5, 12, 16, 0.25),
        0 4px 12px rgba(5, 12, 16, 0.11);
      backdrop-filter: blur(22px) saturate(1.18);
    }

    .split-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 62px;
      padding: 13px 12px 12px 16px;
      border-bottom: 1px solid #ecece8;
    }

    .split-title {
      margin: 0 0 7px;
      font-size: 13px;
      font-weight: 650;
    }

    .split-chips {
      display: flex;
      gap: 6px;
    }

    .split-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 20px;
      padding: 0 7px;
      border-radius: 999px;
      font-size: 9px;
      font-weight: 650;
    }

    .split-chip.alert {
      color: #a94f49;
      background: #f7e1df;
    }

    .split-chip.running {
      color: #9b671d;
      background: #f7ead4;
    }

    .split-panel .panel-close {
      color: #8a8c86;
    }

    @media (hover: hover) and (pointer: fine) {
      .split-panel .panel-close:hover {
        color: #464843;
        background: rgba(92, 96, 89, 0.08);
      }
    }

    .split-groups {
      padding: 8px;
    }

    .split-group-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 28px;
      padding: 0 8px;
      color: #8c8e88;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .split-row {
      display: grid;
      grid-template-columns: 7px 1fr auto;
      align-items: center;
      gap: 11px;
      min-height: 48px;
      padding: 7px 10px;
      border-radius: 9px;
    }

    @media (hover: hover) and (pointer: fine) {
      .split-row:hover {
        background: #f3f4f0;
      }
    }

    .split-row.is-selected {
      background: #eeefeb;
    }

    .split-rail {
      width: 5px;
      height: 24px;
      border-radius: 999px;
    }

    .split-rail.alert { background: #d56f68; }
    .split-rail.running { background: #dc983c; }

    .split-task-title {
      margin-bottom: 3px;
      color: #383a35;
      font-size: 11px;
      font-weight: 600;
    }

    .split-task-meta,
    .split-task-time {
      color: #92948e;
      font-size: 9px;
    }

    .split-task-time {
      font-variant-numeric: tabular-nums;
    }

    .split-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 43px;
      padding: 0 16px;
      border-top: 1px solid #ecece8;
      color: #767872;
      font-size: 10px;
    }

    .split-footer .toggle-switch {
      background: #d8dad5;
    }

    .split-footer .toggle-switch[data-on="true"] {
      background: #4d8f65;
    }

    /* Beacon Stack — literal traffic-light recognition with stronger personality. */
    .beacon-shell {
      align-items: flex-end;
    }

    .beacon-shell .task-light-handle {
      flex-direction: column;
      gap: 7px;
      width: 52px;
      min-height: 90px;
      padding: 10px 0;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(50, 54, 52, 0.98), rgba(24, 27, 26, 0.98));
      box-shadow:
        0 18px 40px rgba(5, 11, 14, 0.30),
        0 3px 8px rgba(5, 11, 14, 0.19),
        0 1px 0 rgba(255, 255, 255, 0.11) inset;
    }

    .beacon-total {
      position: absolute;
      top: -7px;
      right: -7px;
      display: grid;
      min-width: 22px;
      height: 22px;
      padding: 0 6px;
      place-items: center;
      border: 2px solid #2a2e2c;
      border-radius: 999px;
      color: #2f312e;
      background: #fff;
      box-shadow: 0 4px 12px rgba(4, 10, 13, 0.22);
      font-size: 10px;
      font-weight: 750;
      font-variant-numeric: tabular-nums;
    }

    .beacon-light {
      position: relative;
      display: grid;
      width: 17px;
      height: 17px;
      place-items: center;
      border-radius: 50%;
      background: #121413;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.05),
        0 2px 4px rgba(0, 0, 0, 0.42) inset;
    }

    .beacon-light::after {
      content: "";
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #565a57;
      opacity: 0.28;
    }

    .beacon-light.red::after {
      background: #e36d65;
      opacity: 1;
      box-shadow: 0 0 8px rgba(227, 109, 101, 0.68);
    }

    .beacon-light.amber::after {
      background: #efab49;
      opacity: 1;
      box-shadow: 0 0 8px rgba(239, 171, 73, 0.64);
    }

    .beacon-panel {
      width: 334px;
      padding: 0;
      overflow: hidden;
      border: 1px solid rgba(226, 226, 222, 0.96);
      border-radius: 16px;
      background: rgba(252, 252, 251, 0.97);
      box-shadow:
        0 28px 76px rgba(5, 12, 16, 0.26),
        0 4px 12px rgba(5, 12, 16, 0.12);
      backdrop-filter: blur(22px) saturate(1.18);
    }

    .beacon-header {

            <span class="footer-setting">置顶 <button class="toggle-switch" type="button" data-on="true" aria-pressed="true" aria-label="切换始终置顶"></button></span>
          </footer>
        </section>
      </div>
    </div>
  </template>

  <script>
    const variants = [
      () => document.getElementById('variant-quiet').innerHTML,
      () => document.getElementById('variant-split').innerHTML,
      () => document.getElementById('variant-beacon').innerHTML,
    ];

    let dragState = null;

    document.addEventListener('pointerdown', (event) => {
      const handle = event.target.closest('.task-light-handle');
      if (!handle) return;
      const shell = handle.closest('.task-light-shell');
      const bounds = shell.getBoundingClientRect();
      shell.style.right = 'auto';
      shell.style.left = bounds.left + 'px';
      shell.style.top = bounds.top + 'px';
      shell.style.transform = 'translate3d(0, 0, 0)';
      handle.setPointerCapture(event.pointerId);
      dragState = {
        handle,
        shell,
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        startLeft: bounds.left,
        startTop: bounds.top,
        width: bounds.width,
        height: bounds.height,
        dx: 0,
        dy: 0,
        moved: false,
      };
      event.preventDefault();
    });

    document.addEventListener('pointermove', (event) => {
      if (!dragState || event.pointerId !== dragState.pointerId) return;
      const rawDx = event.clientX - dragState.startX;
      const rawDy = event.clientY - dragState.startY;
      const minDx = 16 - dragState.startLeft;
      const maxDx = window.innerWidth - 16 - dragState.width - dragState.startLeft;
      const minDy = 16 - dragState.startTop;
      const maxDy = window.innerHeight - 64 - dragState.height - dragState.startTop;
      dragState.dx = Math.max(minDx, Math.min(maxDx, rawDx));
      dragState.dy = Math.max(minDy, Math.min(maxDy, rawDy));
      dragState.moved = dragState.moved || Math.hypot(rawDx, rawDy) > 4;
      dragState.shell.style.transform =
        'translate3d(' + dragState.dx + 'px, ' + dragState.dy + 'px, 0)';
    });

    function setShellOpen(shell, isOpen) {
      shell.setAttribute('data-open', isOpen ? 'true' : 'false');
      shell.querySelector('.task-light-handle').setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      shell.querySelector('.task-light-panel').setAttribute('aria-hidden', isOpen ? 'false' : 'true');
    }

    function finishDrag(event) {
      if (!dragState || event.pointerId !== dragState.pointerId) return;
      const state = dragState;
      dragState = null;
      state.shell.style.left = state.startLeft + state.dx + 'px';
      state.shell.style.top = state.startTop + state.dy + 'px';
      state.shell.style.transform = 'translate3d(0, 0, 0)';
      if (!state.moved) {
        const isOpen = state.shell.getAttribute('data-open') === 'true';
        setShellOpen(state.shell, !isOpen);
      }
    }

    document.addEventListener('pointerup', finishDrag);
    document.addEventListener('pointercancel', finishDrag);

    document.addEventListener('click', (event) => {
      const closeButton = event.target.closest('.panel-close');
      if (closeButton) {
        setShellOpen(closeButton.closest('.task-light-shell'), false);
        return;
      }

      const toggle = event.target.closest('.toggle-switch');
      if (toggle) {
        const isOn = toggle.getAttribute('data-on') === 'true';
        toggle.setAttribute('data-on', isOn ? 'false' : 'true');
        toggle.setAttribute('aria-pressed', isOn ? 'false' : 'true');
        return;
      }

      const row = event.target.closest('.task-row');
      if (row) {
        const list = row.parentElement;
        list.querySelectorAll('.task-row').forEach((item) => item.classList.remove('is-selected'));
        row.classList.add('is-selected');
      }
    });

    // `variants` is an array of render functions, one per variant, in picker order.
    const stage = document.getElementById('stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
    const replay = picker.querySelector('.proto-picker-replay');
    let current = 0;

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i) {
      stage.innerHTML = '';
      // Clear first, render next frame, so entrance animations re-run.
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
    }

    function setActive(i) {
      if (i < 0 || i >= variants.length) return;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute('data-active', j === i);
        if (j === i) el.setAttribute('aria-current', 'true');
        else el.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', i + 1);
      history.replaceState(null, '', url);
      mount(i);
    }

    items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
    replay?.addEventListener('click', () => mount(current));
    window.addEventListener('resize', moveHighlight);

    document.addEventListener('keydown', (e) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) setActive(num - 1);
      else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
      else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
      else if (e.key === 'r' || e.key === 'R') mount(current);
    });

    setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
    // Enable the slide only after first paint, so load doesn't animate.
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
